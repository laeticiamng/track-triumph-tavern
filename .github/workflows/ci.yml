name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: UTC

    steps:
      - uses: actions/checkout@v4

      # Version de Bun figée : bun.lock (format texte) est lu par Bun >= 1.2 ;
      # « latest » rendait l'installation figée dépendante d'une version mouvante.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Le tsconfig.json racine a « files: [] » : « tsc --noEmit » à la racine
      # ne vérifiait aucun fichier. On vérifie chaque projet explicitement
      # (application, fichiers de configuration, tests).
      - name: Type check
        run: bun run typecheck

      - name: Check i18n keys
        run: node scripts/check-i18n.mjs

      # Rapport informatif (sortie 0) : certaines clés sont construites dynamiquement.
      - name: Check unused i18n keys
        run: node scripts/check-i18n-unused.mjs

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
